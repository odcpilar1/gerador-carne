<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Carnês - Clínica Odontológica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <!-- Substitua pelo caminho da sua logo -->
        <img src="logo.png" alt="Logo da Clínica">
    </div>

    <div class="titulo">
        <h1>Gerador de Carnês</h1>
        <h2>Clínica Odontológica</h2>
    </div>

</header>

<main>

<section class="formulario">

<h3>Dados do Paciente</h3>

<div class="campo">
<label>Nome</label>
<input type="text" id="nome">
</div>

<div class="campo">
<label>CPF</label>
<input type="text" id="cpf">
</div>

<div class="campo">
<label>Telefone</label>
<input type="text" id="telefone">
</div>

<h3>Tratamento</h3>

<div class="campo">
<label>Procedimento</label>
<input type="text" id="procedimento">
</div>

<div class="campo">
<label>Valor Total</label>
<input type="number" id="valorTotal">
</div>

<div class="campo">
<label>Entrada</label>
<input type="number" id="entrada" value="0">
</div>

<div class="campo">
<label>Quantidade de Parcelas</label>
<input type="number" id="parcelas">
</div>

<div class="campo">
<label>Primeiro Vencimento</label>
<input type="date" id="primeiroVencimento">
</div>

<div class="botoes">

<button id="gerar">
Gerar Carnê
</button>

<button id="imprimir">
Imprimir
</button>

<button id="pdf">
Baixar PDF
</button>

<button id="limpar">
Limpar
</button>

</div>

</section>

<section class="preview">

<h2>Pré-visualização do Carnê</h2>

<div id="carnes">

<!-- Os carnês aparecerão aqui -->

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
